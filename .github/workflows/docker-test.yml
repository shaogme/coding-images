name: Docker Image Integration Tests

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "images/**"
      - "scripts/build_local.sh"
      - "test/**"
      - ".github/apparmor/**"
      - ".github/workflows/docker-test.yml"
  push:
    branches:
      - main
      - master
    paths:
      - "images/**"
      - "scripts/build_local.sh"
      - "test/**"
      - ".github/apparmor/**"
      - ".github/workflows/docker-test.yml"

permissions:
  contents: read

jobs:
  image:
    name: ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: common
            test: images/common/tests/docker.sh
          - target: podman
            test: images/podman/tests/docker.sh
          - target: npins-common
            test: images/npins/common/tests/docker.sh
          - target: npins-rust
            test: images/npins/rust/tests/docker.sh
          - target: rust-common
            test: images/rust/common/tests/docker.sh
          - target: rust-cross
            test: images/rust/cross/tests/docker.sh
          - target: rust-wasm
            test: images/rust/wasm/tests/docker.sh
          - target: qemu-common
            test: images/qemu/common/tests/docker.sh
          - target: qemu-rust-common
            test: images/qemu/rust/common/tests/docker.sh
          - target: qemu-rust-cross
            test: images/qemu/rust/cross/tests/docker.sh
    steps:
      - name: Check out repository
        uses: actions/checkout@main

      - name: Allow rootless Podman re-exec under AppArmor
        if: matrix.target == 'podman'
        run: |
          set -Eeuo pipefail
          sudo apparmor_parser -r .github/apparmor/coding-images-podman
          sudo aa-status | grep -F 'coding-images-podman' >/dev/null

      - name: Run build, deployment, and usability test
        run: ${{ matrix.test }}
