name: Docker Image Integration Tests

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - "images/**"
      - "scripts/build_local.sh"
      - "test/**"
      - ".github/workflows/docker-test.yml"
  push:
    branches:
      - main
    paths:
      - "images/**"
      - "scripts/build_local.sh"
      - "test/**"
      - ".github/workflows/docker-test.yml"

permissions:
  contents: read

jobs:
  image:
    name: ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: common
            test: images/common/tests/docker.sh
          - target: podman
            test: images/podman/tests/docker.sh
          - target: npins-common
            test: images/npins/common/tests/docker.sh
          - target: npins-rust
            test: images/npins/rust/tests/docker.sh
          - target: rust-common
            test: images/rust/common/tests/docker.sh
          - target: rust-cross
            test: images/rust/cross/tests/docker.sh
          - target: rust-wasm
            test: images/rust/wasm/tests/docker.sh
          - target: qemu-common
            test: images/qemu/common/tests/docker.sh
          - target: qemu-rust-common
            test: images/qemu/rust/common/tests/docker.sh
          - target: qemu-rust-cross
            test: images/qemu/rust/cross/tests/docker.sh
    steps:
      - name: Check out repository
        uses: actions/checkout@main

      - name: Run build, deployment, and usability test
        run: ${{ matrix.test }}

  ci-success:
    name: CI Success
    runs-on: ubuntu-latest
    needs: image
    if: always()
    steps:
      - name: Check test results
        run: |
          if [ "${{ needs.image.result }}" = "success" ]; then
            echo "All image tests passed successfully."
            exit 0
          else
            echo "One or more image tests failed: ${{ needs.image.result }}"
            exit 1
          fi
