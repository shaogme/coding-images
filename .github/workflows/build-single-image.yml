name: Build Single Image Architectures

on:
  workflow_call:
    inputs:
      image_name:
        description: Image name
        required: true
        type: string
      context:
        description: Docker build context path
        required: true
        type: string
      dockerfile:
        description: Dockerfile path
        required: true
        type: string
      runtime_parent:
        description: Runtime parent image name or upstream mise image
        required: true
        type: string
      builder_parent_tag:
        description: Local architecture-tagged builder parent name
        required: true
        type: string
      builder_artifact_parent:
        description: Image whose builder archive should be downloaded
        required: true
        type: string
      builder_mode:
        description: mise or passthrough
        required: true
        type: string
      build_args:
        description: Additional build args
        required: false
        default: ''
        type: string
      nixos_dockers_version:
        description: Immutable upstream NixOS Docker version
        required: false
        default: latest
        type: string
      push:
        description: Push an architecture image to a temporary GHCR tag
        required: false
        default: true
        type: boolean
      ancestors:
        description: Runtime ancestors for BuildKit cache imports
        required: false
        default: '["global"]'
        type: string

jobs:
  build-arch:
    name: Build (${{ inputs.image_name }} - ${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: amd64
            platform: linux/amd64
          - os: ubuntu-24.04-arm
            arch: arm64
            platform: linux/arm64
    steps:
      - name: Checkout repository
        uses: actions/checkout@main

      - name: Require Mise lockfile
        if: inputs.builder_mode == 'mise'
        run: |
          set -Eeuo pipefail
          test -f "${{ inputs.context }}/.config/mise.toml"
          test -s "${{ inputs.context }}/.config/mise.lock"

      - name: Enable Docker containerd image store
        uses: docker/setup-docker-action@v4
        with:
          daemon-config: |
            {
              "features": {
                "containerd-snapshotter": true
              }
            }

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          # The Docker driver resolves locally loaded parent images.
          driver: docker

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Download parent runtime archive for push=false
        if: ${{ !inputs.push && inputs.runtime_parent != 'mise' }}
        uses: actions/download-artifact@main
        with:
          name: runtime-${{ inputs.runtime_parent }}-${{ matrix.arch }}
          path: /tmp/parent-runtime

      - name: Download parent builder archive
        if: inputs.builder_artifact_parent != 'mise-builder'
        uses: actions/download-artifact@main
        with:
          name: builder-${{ inputs.builder_artifact_parent }}-${{ matrix.arch }}
          path: /tmp/parent-builder

      - name: Verify and load parent images
        env:
          REPOSITORY: ${{ github.repository }}
          IMAGE_NAME: ${{ inputs.image_name }}
          RUNTIME_PARENT: ${{ inputs.runtime_parent }}
          BUILDER_ARTIFACT_PARENT: ${{ inputs.builder_artifact_parent }}
          BUILDER_PARENT_TAG: ${{ inputs.builder_parent_tag }}
          NIXOS_DOCKERS_VERSION: ${{ inputs.nixos_dockers_version }}
          ARCH: ${{ matrix.arch }}
          PLATFORM: ${{ matrix.platform }}
          PUSH: ${{ inputs.push }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -Eeuo pipefail
          REPO_LOWER=$(echo "$REPOSITORY" | tr '[:upper:]' '[:lower:]')
          IMAGE_BASE="ghcr.io/${REPO_LOWER}"
          TEMP_SUFFIX="ci-${RUN_ID}-${RUN_ATTEMPT}-${ARCH}"

          load_archive() {
            local archive="$1"
            local checksum="${archive%.tar.gz}.sha256"
            test -f "$archive" && test -f "$checksum"
            (cd "$(dirname "$archive")" && sha256sum -c "$(basename "$checksum")")
            gzip -dc "$archive" | docker load
          }

          if [ "$RUNTIME_PARENT" = 'mise' ]; then
            docker pull --platform "$PLATFORM" "ghcr.io/shaogme/nixos-dockers/mise:${NIXOS_DOCKERS_VERSION}"
            docker tag "ghcr.io/shaogme/nixos-dockers/mise:${NIXOS_DOCKERS_VERSION}" "local/coding-images/mise:${ARCH}"
          elif [ "$PUSH" = 'true' ]; then
            docker pull --platform "$PLATFORM" "${IMAGE_BASE}/${RUNTIME_PARENT}:${TEMP_SUFFIX}"
            docker tag "${IMAGE_BASE}/${RUNTIME_PARENT}:${TEMP_SUFFIX}" "local/coding-images/${RUNTIME_PARENT}:${ARCH}"
          else
            load_archive "/tmp/parent-runtime/runtime-${RUNTIME_PARENT}-${ARCH}.tar.gz"
          fi

          if [ "$BUILDER_ARTIFACT_PARENT" = 'mise-builder' ]; then
            docker pull --platform "$PLATFORM" "ghcr.io/shaogme/nixos-dockers/mise-builder:${NIXOS_DOCKERS_VERSION}"
            docker tag "ghcr.io/shaogme/nixos-dockers/mise-builder:${NIXOS_DOCKERS_VERSION}" "local/coding-images/mise-builder:${ARCH}"
          else
            load_archive "/tmp/parent-builder/builder-${BUILDER_ARTIFACT_PARENT}-${ARCH}.tar.gz"
            # Passthrough images reuse the nearest Mise builder artifact.
            if [ "${BUILDER_ARTIFACT_PARENT}-builder" != "$BUILDER_PARENT_TAG" ]; then
              docker tag "local/coding-images/${BUILDER_ARTIFACT_PARENT}-builder:${ARCH}" "local/coding-images/${BUILDER_PARENT_TAG}:${ARCH}"
            fi
          fi

      - name: Configure independent BuildKit caches
        id: cache
        env:
          REPOSITORY: ${{ github.repository }}
          ANCESTORS: ${{ inputs.ancestors }}
        run: |
          set -Eeuo pipefail
          REPO_LOWER=$(echo "$REPOSITORY" | tr '[:upper:]' '[:lower:]')
          CACHE_REPO="ghcr.io/${REPO_LOWER}/buildcache"
          IMAGE='${{ inputs.image_name }}'
          ARCH='${{ matrix.arch }}'
          {
            echo 'builder_from<<EOF'
            echo "type=gha,scope=builder-${IMAGE}-${ARCH}"
            echo "type=registry,ref=${CACHE_REPO}:builder-${IMAGE}-${ARCH}"
            echo 'EOF'
            echo 'builder_to<<EOF'
            echo "type=gha,mode=max,scope=builder-${IMAGE}-${ARCH}"
            echo "type=registry,ref=${CACHE_REPO}:builder-${IMAGE}-${ARCH},mode=max,image-manifest=true"
            echo 'EOF'
            echo 'runtime_from<<EOF'
            echo "type=gha,scope=runtime-${IMAGE}-${ARCH}"
            echo "type=registry,ref=${CACHE_REPO}:runtime-${IMAGE}-${ARCH}"
            echo "type=gha,scope=builder-${IMAGE}-${ARCH}"
            echo "type=registry,ref=${CACHE_REPO}:builder-${IMAGE}-${ARCH}"
            for ancestor in $(echo "$ANCESTORS" | jq -r '.[]? // empty'); do
              echo "type=gha,scope=runtime-${ancestor}-${ARCH}"
              echo "type=registry,ref=${CACHE_REPO}:runtime-${ancestor}-${ARCH}"
            done
            echo 'EOF'
            echo 'runtime_to<<EOF'
            echo "type=gha,mode=max,scope=runtime-${IMAGE}-${ARCH}"
            echo "type=registry,ref=${CACHE_REPO}:runtime-${IMAGE}-${ARCH},mode=max,image-manifest=true"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Set temporary runtime image reference
        id: image-ref
        if: inputs.push
        env:
          REPOSITORY: ${{ github.repository }}
          IMAGE_NAME: ${{ inputs.image_name }}
          ARCH: ${{ matrix.arch }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          REPO_LOWER=$(echo "$REPOSITORY" | tr '[:upper:]' '[:lower:]')
          echo "tag=ghcr.io/${REPO_LOWER}/${IMAGE_NAME}:ci-${RUN_ID}-${RUN_ATTEMPT}-${ARCH}" >> "$GITHUB_OUTPUT"
          echo "arch_tag=ghcr.io/${REPO_LOWER}/${IMAGE_NAME}:${ARCH}" >> "$GITHUB_OUTPUT"

      - name: Build builder archive
        if: inputs.builder_mode == 'mise'
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          target: mise-builder
          build-args: |
            ${{ inputs.build_args }}
            NIXOS_DOCKERS_VERSION=${{ inputs.nixos_dockers_version }}
            RUNTIME_PARENT_IMAGE=local/coding-images/${{ inputs.runtime_parent }}:${{ matrix.arch }}
            BUILDER_PARENT_IMAGE=local/coding-images/${{ inputs.builder_parent_tag }}:${{ matrix.arch }}
          secrets: |
            GITHUB_TOKEN=${{ secrets.GITHUB_TOKEN }}
          pull: false
          platforms: ${{ matrix.platform }}
          tags: local/coding-images/${{ inputs.image_name }}-builder:${{ matrix.arch }}
          outputs: type=docker,dest=/tmp/builder-${{ inputs.image_name }}-${{ matrix.arch }}.tar
          cache-from: ${{ steps.cache.outputs.builder_from }}
          cache-to: ${{ steps.cache.outputs.builder_to }}

      - name: Build and push runtime architecture image
        if: inputs.push
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          target: runtime
          build-args: |
            ${{ inputs.build_args }}
            NIXOS_DOCKERS_VERSION=${{ inputs.nixos_dockers_version }}
            RUNTIME_PARENT_IMAGE=local/coding-images/${{ inputs.runtime_parent }}:${{ matrix.arch }}
            BUILDER_PARENT_IMAGE=local/coding-images/${{ inputs.builder_parent_tag }}:${{ matrix.arch }}
          secrets: |
            GITHUB_TOKEN=${{ secrets.GITHUB_TOKEN }}
          pull: false
          platforms: ${{ matrix.platform }}
          tags: |
            ${{ steps.image-ref.outputs.tag }}
            ${{ steps.image-ref.outputs.arch_tag }}
          push: true
          cache-from: ${{ steps.cache.outputs.runtime_from }}
          cache-to: ${{ steps.cache.outputs.runtime_to }}

      - name: Build runtime archive for push=false
        if: ${{ !inputs.push }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          target: runtime
          build-args: |
            ${{ inputs.build_args }}
            NIXOS_DOCKERS_VERSION=${{ inputs.nixos_dockers_version }}
            RUNTIME_PARENT_IMAGE=local/coding-images/${{ inputs.runtime_parent }}:${{ matrix.arch }}
            BUILDER_PARENT_IMAGE=local/coding-images/${{ inputs.builder_parent_tag }}:${{ matrix.arch }}
          secrets: |
            GITHUB_TOKEN=${{ secrets.GITHUB_TOKEN }}
          pull: false
          platforms: ${{ matrix.platform }}
          tags: local/coding-images/${{ inputs.image_name }}:${{ matrix.arch }}
          outputs: type=docker,dest=/tmp/runtime-${{ inputs.image_name }}-${{ matrix.arch }}.tar
          cache-from: ${{ steps.cache.outputs.runtime_from }}
          cache-to: ${{ steps.cache.outputs.runtime_to }}

      - name: Compress and checksum archives
        run: |
          set -Eeuo pipefail
          if [ '${{ inputs.builder_mode }}' = 'mise' ]; then
            gzip -1 "/tmp/builder-${{ inputs.image_name }}-${{ matrix.arch }}.tar"
            (cd /tmp && sha256sum "builder-${{ inputs.image_name }}-${{ matrix.arch }}.tar.gz") > "/tmp/builder-${{ inputs.image_name }}-${{ matrix.arch }}.sha256"
          fi
          if [ '${{ inputs.push }}' = 'false' ]; then
            gzip -1 "/tmp/runtime-${{ inputs.image_name }}-${{ matrix.arch }}.tar"
            (cd /tmp && sha256sum "runtime-${{ inputs.image_name }}-${{ matrix.arch }}.tar.gz") > "/tmp/runtime-${{ inputs.image_name }}-${{ matrix.arch }}.sha256"
          fi

      - name: Upload runtime archive for push=false
        if: ${{ !inputs.push }}
        uses: actions/upload-artifact@main
        with:
          name: runtime-${{ inputs.image_name }}-${{ matrix.arch }}
          path: |
            /tmp/runtime-${{ inputs.image_name }}-${{ matrix.arch }}.tar.gz
            /tmp/runtime-${{ inputs.image_name }}-${{ matrix.arch }}.sha256
          compression-level: 0
          if-no-files-found: error
          retention-days: 1

      - name: Upload builder archive
        if: inputs.builder_mode == 'mise'
        uses: actions/upload-artifact@main
        with:
          name: builder-${{ inputs.image_name }}-${{ matrix.arch }}
          path: |
            /tmp/builder-${{ inputs.image_name }}-${{ matrix.arch }}.tar.gz
            /tmp/builder-${{ inputs.image_name }}-${{ matrix.arch }}.sha256
          compression-level: 0
          if-no-files-found: error
          retention-days: 1
