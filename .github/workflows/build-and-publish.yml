    secrets: inherit

  build-rust-common:
    name: Build rust-common
    needs: [discover-images, build-podman, build-common]
    if: ${{ always() && needs.discover-images.result == 'success' && contains(fromJSON(needs.discover-images.outputs.image_names), 'rust-common') && needs.build-podman.result == 'success' && needs.build-common.result == 'success' }}
    uses: ./.github/workflows/build-single-image.yml
    with:
      image_name: rust-common
      context: images/rust/common
      dockerfile: images/rust/common/docker/Dockerfile
      runtime_parent: podman
      builder_parent_tag: common-builder
      builder_artifact_parent: common
      builder_mode: mise
      ancestors: '["podman","common","global"]'
      push: ${{ needs.discover-images.outputs.should_push == 'true' }}
      nixos_dockers_version: ${{ needs.discover-images.outputs.nixos_dockers_version }}
    secrets: inherit

  publish-rust-common:
    name: Publish rust-common
    needs: [discover-images, build-rust-common]
    if: ${{ always() && needs.discover-images.result == 'success' && needs.discover-images.outputs.should_push == 'true' && needs.build-rust-common.result == 'success' }}
    uses: ./.github/workflows/publish-single-image.yml
    with:
