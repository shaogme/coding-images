name: Build and Publish Images

on:
  # Daily schedule at 04:00 AM Beijing Time (CST = UTC+8 -> 20:00 UTC previous day)
  schedule:
    - cron: '0 20 * * *'

  # Manual trigger with options
  workflow_dispatch:
    inputs:
      target_image:
        description: 'Target image to build (e.g., common, rust-common, rust-wasm, or "all")'
        required: true
        default: 'all'
        type: string
      push:
        description: 'Push images to GitHub Container Registry (ghcr.io)'
        required: true
        default: true
        type: boolean
      extra_tag:
        description: 'Optional additional tag (e.g., v1.0.0)'
        required: false
        default: ''
        type: string
      nixos_dockers_version:
        description: 'Immutable NixOS Docker base tag shared by runtime and builder stages'
        required: false
        default: 'latest'
        type: string

  # Automatically trigger on push to main branch when images or workflow change
  push:
    branches:
      - main
    paths:
      - 'images/**'
      - '.github/workflows/**'
      - 'scripts/**'

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  discover-images:
    name: Discover Images
    runs-on: ubuntu-latest
    outputs:
      image_names: ${{ steps.set-target.outputs.image_names }}
      should_push: ${{ steps.set-params.outputs.should_push }}
      extra_tag: ${{ steps.set-params.outputs.extra_tag }}
      nixos_dockers_version: ${{ steps.set-params.outputs.nixos_dockers_version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@main

      - name: Determine parameters
        id: set-params
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_PUSH: ${{ inputs.push }}
          INPUT_EXTRA_TAG: ${{ inputs.extra_tag }}
          INPUT_NIXOS_DOCKERS_VERSION: ${{ inputs.nixos_dockers_version }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            printf 'should_push=%s\n' "$INPUT_PUSH" >> "$GITHUB_OUTPUT"
            printf 'extra_tag=%s\n' "$INPUT_EXTRA_TAG" >> "$GITHUB_OUTPUT"
            printf 'nixos_dockers_version=%s\n' "$INPUT_NIXOS_DOCKERS_VERSION" >> "$GITHUB_OUTPUT"
          else
            printf 'should_push=true\nextra_tag=\nnixos_dockers_version=latest\n' >> "$GITHUB_OUTPUT"
          fi

      - name: Discover target dependency closure
        id: set-target
        env:
          TARGET_IMAGE: ${{ github.event_name == 'workflow_dispatch' && inputs.target_image || 'all' }}
        run: python3 scripts/discover_images.py --target "$TARGET_IMAGE" --github-output "$GITHUB_OUTPUT"

  # Each build waits only for the images that provide its runtime parent or
  # builder archive. Publishing is a separate job and never blocks descendants.
  build-common:
    name: Build common
    needs: discover-images
    if: ${{ needs.discover-images.result == 'success' && contains(fromJSON(needs.discover-images.outputs.image_names), 'common') }}
    uses: ./.github/workflows/build-single-image.yml
    with:
      image_name: common
      context: images/common
      dockerfile: images/common/docker/Dockerfile
      runtime_parent: mise
      builder_parent_tag: mise-builder
      builder_artifact_parent: mise-builder
      builder_mode: mise
      ancestors: '["global"]'
      push: ${{ needs.discover-images.outputs.should_push == 'true' }}
      nixos_dockers_version: ${{ needs.discover-images.outputs.nixos_dockers_version }}
    secrets: inherit

  publish-common:
    name: Publish common
    needs: [discover-images, build-common]
    if: ${{ always() && needs.discover-images.result == 'success' && needs.discover-images.outputs.should_push == 'true' && needs.build-common.result == 'success' }}
    uses: ./.github/workflows/publish-single-image.yml
    with:
      image_name: common
      extra_tag: ${{ needs.discover-images.outputs.extra_tag }}
    secrets: inherit

  build-podman:
    name: Build podman
    needs: [discover-images, build-common]
    if: ${{ always() && needs.discover-images.result == 'success' && contains(fromJSON(needs.discover-images.outputs.image_names), 'podman') && needs.build-common.result == 'success' }}
    uses: ./.github/workflows/build-single-image.yml
    with:
      image_name: podman
      context: images/podman
      dockerfile: images/podman/docker/Dockerfile
      runtime_parent: common
      builder_parent_tag: common-builder
      builder_artifact_parent: common
      builder_mode: passthrough
      ancestors: '["common","global"]'
      push: ${{ needs.discover-images.outputs.should_push == 'true' }}
      nixos_dockers_version: ${{ needs.discover-images.outputs.nixos_dockers_version }}
    secrets: inherit

  publish-podman:
    name: Publish podman
    needs: [discover-images, build-podman]
    if: ${{ always() && needs.discover-images.result == 'success' && needs.discover-images.outputs.should_push == 'true' && needs.build-podman.result == 'success' }}
    uses: ./.github/workflows/publish-single-image.yml
    with:
      image_name: podman
      extra_tag: ${{ needs.discover-images.outputs.extra_tag }}
    secrets: inherit

  build-npins-common:
    name: Build npins-common
    needs: [discover-images, build-common]
    if: ${{ always() && needs.discover-images.result == 'success' && contains(fromJSON(needs.discover-images.outputs.image_names), 'npins-common') && needs.build-common.result == 'success' }}
    uses: ./.github/workflows/build-single-image.yml
