name: Build and Publish Images

on:
  # Daily schedule at 04:00 AM Beijing Time (CST = UTC+8 -> 20:00 UTC previous day)
  schedule:
    - cron: '0 20 * * *'

  # Manual trigger with options
  workflow_dispatch:
    inputs:
      target_image:
        description: 'Target image to build (e.g., common, rust-common, rust-wasm, or "all")'
        required: true
        default: 'all'
        type: string
      push:
        description: 'Push images to GitHub Container Registry (ghcr.io)'
        required: true
        default: true
        type: boolean
      extra_tag:
        description: 'Optional additional tag (e.g., v1.0.0)'
        required: false
        default: ''
        type: string

  # Automatically trigger on push to main branch when images or workflow change
  push:
    branches:
      - main
      - master
    paths:
      - 'images/**'
      - '.github/workflows/**'
      - 'scripts/**'

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # --------------------------------------------------------------------------
  # 1. Discover all images and group into staged matrices
  # --------------------------------------------------------------------------
  discover-images:
    name: Discover Images
    runs-on: ubuntu-latest
    outputs:
      stage_0: ${{ steps.set-matrix.outputs.stage_0 }}
      stage_1: ${{ steps.set-matrix.outputs.stage_1 }}
      stage_2: ${{ steps.set-matrix.outputs.stage_2 }}
      has_stage_0: ${{ steps.set-matrix.outputs.has_stage_0 }}
      has_stage_1: ${{ steps.set-matrix.outputs.has_stage_1 }}
      has_stage_2: ${{ steps.set-matrix.outputs.has_stage_2 }}
      should_push: ${{ steps.set-params.outputs.should_push }}
      extra_tag: ${{ steps.set-params.outputs.extra_tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@main

      - name: Determine parameters
        id: set-params
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "should_push=${{ inputs.push }}" >> $GITHUB_OUTPUT
            echo "extra_tag=${{ inputs.extra_tag }}" >> $GITHUB_OUTPUT
          else
            echo "should_push=true" >> $GITHUB_OUTPUT
            echo "extra_tag=" >> $GITHUB_OUTPUT
          fi

      - name: Scan images directory and group stages
        id: set-matrix
        env:
          TARGET_IMAGE: ${{ github.event_name == 'workflow_dispatch' && inputs.target_image || 'all' }}
        run: |
          python3 scripts/discover_images.py --target "${TARGET_IMAGE}" --github-output "${GITHUB_OUTPUT}"

  # --------------------------------------------------------------------------
  # 2. Stage 0: Base image (common)
  # --------------------------------------------------------------------------
  build-stage-0:
    name: Stage 0
    needs: discover-images
    if: needs.discover-images.outputs.has_stage_0 == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.discover-images.outputs.stage_0) }}
    uses: ./.github/workflows/build-single-image.yml
    with:
      image_name: ${{ matrix.image_name }}
      context: ${{ matrix.context }}
      dockerfile: ${{ matrix.dockerfile }}
      ancestors: ${{ matrix.ancestors }}
      push: ${{ needs.discover-images.outputs.should_push == 'true' }}
      extra_tag: ${{ needs.discover-images.outputs.extra_tag }}
    secrets: inherit

  # --------------------------------------------------------------------------
  # 3. Stage 1: Layer 1 images based on common (rust-common, npins-common)
  # --------------------------------------------------------------------------
  build-stage-1:
    name: Stage 1
    needs: [discover-images, build-stage-0]
    if: always() && needs.discover-images.outputs.has_stage_1 == 'true' && (needs.build-stage-0.result == 'success' || needs.discover-images.outputs.has_stage_0 != 'true')
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.discover-images.outputs.stage_1) }}
    uses: ./.github/workflows/build-single-image.yml
    with:
      image_name: ${{ matrix.image_name }}
      context: ${{ matrix.context }}
      dockerfile: ${{ matrix.dockerfile }}
      ancestors: ${{ matrix.ancestors }}
      push: ${{ needs.discover-images.outputs.should_push == 'true' }}
      extra_tag: ${{ needs.discover-images.outputs.extra_tag }}
    secrets: inherit

  # --------------------------------------------------------------------------
  # 4. Stage 2: Layer 2 images based on rust-common (rust-wasm, npins-rust)
  # --------------------------------------------------------------------------
  build-stage-2:
    name: Stage 2
    needs: [discover-images, build-stage-1]
    if: always() && needs.discover-images.outputs.has_stage_2 == 'true' && (needs.build-stage-1.result == 'success' || needs.discover-images.outputs.has_stage_1 != 'true')
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.discover-images.outputs.stage_2) }}
    uses: ./.github/workflows/build-single-image.yml
    with:
      image_name: ${{ matrix.image_name }}
      context: ${{ matrix.context }}
      dockerfile: ${{ matrix.dockerfile }}
      ancestors: ${{ matrix.ancestors }}
      push: ${{ needs.discover-images.outputs.should_push == 'true' }}
      extra_tag: ${{ needs.discover-images.outputs.extra_tag }}
    secrets: inherit
