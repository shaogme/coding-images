      nixos_dockers_version: ${{ needs.discover-images.outputs.nixos_dockers_version }}
    secrets: inherit

  publish-npins-common:
    name: Publish npins-common
    needs: [discover-images, build-npins-common]
    if: ${{ always() && needs.discover-images.result == 'success' && needs.discover-images.outputs.should_push == 'true' && needs.build-npins-common.result == 'success' }}
    uses: ./.github/workflows/publish-single-image.yml
    with:
