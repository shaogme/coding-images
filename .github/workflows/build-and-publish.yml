      runtime_parent: rust-common
      builder_parent_tag: rust-common-builder
      builder_artifact_parent: rust-common
      builder_mode: passthrough
      ancestors: '["rust-common","podman","common","global"]'
      push: ${{ needs.discover-images.outputs.should_push == 'true' }}
      nixos_dockers_version: ${{ needs.discover-images.outputs.nixos_dockers_version }}
    secrets: inherit

  publish-npins-rust:
    name: Publish npins-rust
