  build-npins-rust:
    name: Build npins-rust
    needs: [discover-images, build-rust-common]
    if: ${{ always() && needs.discover-images.result == 'success' && contains(fromJSON(needs.discover-images.outputs.image_names), 'npins-rust') && needs.build-rust-common.result == 'success' }}
    uses: ./.github/workflows/build-single-image.yml
    with:
