schema = 1
id = "coding-images-podman"
extends = ["coding-images"]

[override."environment.path.prepend"]
op = "replace"
values = ["/usr/local/share/mise/shims", "/usr/local/bin", "/nix/var/nix/profiles/default/bin"]
reason = "put local wrapper scripts in /usr/local/bin ahead of nix profile"

[config.environment.variables]
CONTAINER_HOST = "unix:///run/podman/podman.sock"
DOCKER_HOST = "unix:///run/podman/podman.sock"

[[bootstrap.actions]]
id = "usr-local-bin"
kind = "filesystem.ensure_dir"
path = "/usr/local/bin"
mode = "0755"
owner = "root"
run_as = "root"

[[bootstrap.actions]]
id = "docker-link"
kind = "filesystem.ensure_symlink"
link = "/usr/local/bin/docker"
target = "/usr/local/bin/podman"
owner = "root"
run_as = "root"
depends_on = ["usr-local-bin"]

[[bootstrap.actions]]
id = "docker-compose-link"
kind = "filesystem.ensure_symlink"
link = "/usr/local/bin/docker-compose"
target = "/usr/local/bin/podman-compose"
owner = "root"
run_as = "root"
depends_on = ["usr-local-bin"]
