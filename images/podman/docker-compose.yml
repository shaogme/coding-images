services:
  podman:
    image: ghcr.io/shaogme/nixos-dockers/podman:${NIXOS_DOCKERS_VERSION:-latest}
    command: ["podman", "system", "service", "--time=0", "unix:///run/podman/podman.sock"]
    environment:
      - PODMAN_SOCKET_GID=${PODMAN_SOCKET_GID:-1000}
      - PODMAN_SOCKET_MODE=${PODMAN_SOCKET_MODE:-0660}
    volumes:
      - podman-socket:/run/podman
      - podman-data:/var/lib/containers
      - .:/workspace
    # Rootless outer runtimes keep the engine inside their delegated user and
    # cgroup namespaces. cgroups remain enabled and the namespace is private.
    cgroup: private
    cap_drop: [ALL]
    cap_add:
      - SYS_ADMIN
      - SETUID
      - SETGID
      - DAC_OVERRIDE
    security_opt:
      - seccomp:unconfined
      - systempaths:unconfined
    group_add:
      - "${PODMAN_SOCKET_GID:-1000}"
    devices:
      - /dev/fuse:/dev/fuse
      - /dev/net/tun:/dev/net/tun
    healthcheck:
      test: ["CMD-SHELL", "podman --remote --url unix:///run/podman/podman.sock info >/dev/null 2>&1"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 2s

  dev:
    image: ghcr.io/shaogme/coding-images/podman:latest
    depends_on:
      podman:
        condition: service_healthy
    environment:
      - DEVBOX_AUTO_INIT=${DEVBOX_AUTO_INIT:-0}
      - HOST_UID
      - HOST_GID
      - PODMAN_SOCKET_GID=${PODMAN_SOCKET_GID:-1000}
      - CONTAINER_HOST=unix:///run/podman/podman.sock
      - DOCKER_HOST=unix:///run/podman/podman.sock
    volumes:
      - .:/workspace
      - podman-socket:/run/podman
      - cache:/data/cache
      - devbox-data:/data/devbox
      - coding-config:/data/coding-config
    group_add:
      - "${PODMAN_SOCKET_GID:-1000}"
    tty: true

volumes:
  podman-socket:
  podman-data:
  cache:
  devbox-data:
  coding-config:
