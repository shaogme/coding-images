[settings.cargo]
binstall = true
binstall_native = true
binstall_quickinstall = true

[tools]
rust = {
    version = "stable",
    components = ["rust-src"],
}

# Rust 工具
"cargo:cargo-binstall" = {
    version = "latest",
    depends = ["rust"],
}

"cargo:cargo-nextest" = {
    version = "latest",
    depends = ["cargo:cargo-binstall"],
}
