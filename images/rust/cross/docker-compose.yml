services:
  # Base configuration for the application
  app-base: &app-base
    image: ghcr.io/shaogme/coding-images/rust-cross:latest
    environment:
      - ROOT_PASSWORD=root # Set your secure password here
      - MISE_YES=1 # Non-interactive mode for mise
      - CARGO_INCREMENTAL=1 # Enable incremental compilation for Rust builds
      - CROSS_CONTAINER_ENGINE=podman # Direct cross to use containerized Podman engine
    security_opt:
      - seccomp:unconfined # Required for inner container execution and trace
      - label:disable # Disable SELinux labeling separation for containers
    cap_add:
      - SYS_ADMIN
      - SYS_PTRACE
      - NET_ADMIN
    devices:
      - /dev/fuse:/dev/fuse # Allow fuse-overlayfs inside container
    tty: true

  # Develop mode: Mounts local directory for hot-reloading (Default)
  dev:
    <<: *app-base
    container_name: rust-cross-dev
    volumes:
      # Mount host source code
      - .:/root/workspace
      # Isolate Rust build artifacts inside a dedicated named Docker volume (high-performance Linux ext4)
      - rust-target:/root/workspace/target
      # Persist Cargo dependencies, crate index, and git checkouts
      - cargo-registry:/root/.cargo/registry
      - cargo-git:/root/.cargo/git
      # Persist Podman containers and cached cross-compilation toolchain images
      - podman-containers:/var/lib/containers
      # Persist direnv data
      - direnv-data:/root/.local/share/direnv
      # Persist AI CLI configurations and tokens
      - codex-config:/root/.codex
      - gemini-config:/root/.gemini
      - opencode-config:/root/.config/opencode
      - claude-config:/root/.claude

  # Standalone mode: Uses code copied into the image (No host mounting)
  standalone:
    <<: *app-base
    container_name: rust-cross-standalone
    volumes:
      # Isolate Rust build artifacts inside a dedicated named Docker volume (high-performance Linux ext4)
      - rust-target:/root/workspace/target
      # Persist Cargo dependencies, crate index, and git checkouts
      - cargo-registry:/root/.cargo/registry
      - cargo-git:/root/.cargo/git
      # Persist Podman containers and cached cross-compilation toolchain images
      - podman-containers:/var/lib/containers
      # Persist direnv data
      - direnv-data:/root/.local/share/direnv
      # Persist AI CLI configurations and tokens
      - codex-config:/root/.codex
      - gemini-config:/root/.gemini
      - opencode-config:/root/.config/opencode
      - claude-config:/root/.claude
    profiles:
      - standalone

volumes:
  rust-target:
  cargo-registry:
  cargo-git:
  podman-containers:
  mise-cache:
  direnv-data:
  codex-config:
  gemini-config:
  opencode-config:
  claude-config:
