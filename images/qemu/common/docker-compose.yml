x-podman-engine: &podman-engine
  image: ghcr.io/shaogme/nixos-dockers/podman:${NIXOS_DOCKERS_VERSION:-latest}
  command: ["podman", "system", "service", "--time=0", "unix:///run/podman/podman.sock"]
  environment:
    - PODMAN_SOCKET_GID=${PODMAN_SOCKET_GID:-1000}
    - PODMAN_SOCKET_MODE=${PODMAN_SOCKET_MODE:-0660}
  volumes:
    - podman-socket:/run/podman
    - podman-data:/var/lib/containers
    - .:/workspace
  user: "1000:1000"
  cgroup: private
  cap_drop: [ALL]
  cap_add:
    - SYS_ADMIN
    - SETUID
    - SETGID
    - DAC_OVERRIDE
  security_opt:
    - seccomp:unconfined
    - systempaths:unconfined
  group_add:
    - "${PODMAN_SOCKET_GID:-1000}"
  devices:
    - /dev/fuse:/dev/fuse
    - /dev/net/tun:/dev/net/tun
  healthcheck:
    test: ["CMD-SHELL", "podman --remote --url unix:///run/podman/podman.sock info >/dev/null 2>&1"]
    interval: 2s
    timeout: 3s
    retries: 30

x-app-base: &app-base
  image: ghcr.io/shaogme/coding-images/qemu-common:latest
  environment:
    - DEVBOX_AUTO_INIT=${DEVBOX_AUTO_INIT:-0}
    - HOST_UID
    - HOST_GID
    - PODMAN_SOCKET_GID=${PODMAN_SOCKET_GID:-1000}
    - CONTAINER_HOST=unix:///run/podman/podman.sock
    - DOCKER_HOST=unix:///run/podman/podman.sock
  # QEMU uses NET_ADMIN to configure its explicit TAP bridge.
  cap_add: [NET_ADMIN]
  security_opt: ["seccomp:unconfined", "apparmor:unconfined"]
  devices:
    - /dev/kvm:/dev/kvm # QEMU KVM acceleration
    - /dev/net/tun:/dev/net/tun # QEMU TAP networking
  tty: true

services:
  podman:
    <<: *podman-engine
  dev:
    <<: *app-base
    container_name: qemu-common-dev
    depends_on:
      podman:
        condition: service_healthy
    volumes:
      - .:/workspace
      - podman-socket:/run/podman
      - cache:/data/cache
      - qemu-data:/data/qemu
      - devbox-data:/data/devbox
      - coding-config:/data/coding-config
    group_add:
      - "${PODMAN_SOCKET_GID:-1000}"

volumes:
  podman-socket:
  podman-data:
  cache:
  qemu-data:
  devbox-data:
  coding-config:
