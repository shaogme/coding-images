[settings.cargo]
binstall = true
binstall_native = true
binstall_quickinstall = true

[tools]
rust = [
    {
        version = "stable",
        components = ["rust-src"],
    },
    {
        version = "nightly",
        components = ["rust-src", "miri"],
    },
]

# Rust 工具
cargo-binstall = {
    version = "latest",
}

sccache = {
    version = "latest",
}

"cargo:cargo-nextest" = {
    version = "latest",
    depends = ["cargo-binstall"],
}

"cargo:cargo-sweep" = {
    version = "latest",
    depends = ["cargo-binstall"],
}

"cargo:cargo-geiger" = {
    version = "latest",
    depends = ["cargo-binstall"],
}

"cargo:cargo-audit" = {
    version = "latest",
    depends = ["cargo-binstall"],
}

"cargo:flamegraph" = {
    version = "latest",
    depends = ["cargo-binstall"],
}

"cargo:samply" = {
    version = "latest",
    depends = ["cargo-binstall"],
}

"cargo:cargo-show-asm" = {
    version = "latest",
    depends = ["cargo-binstall"],
}

"cargo:cargo-expand" = {
    version = "latest",
    depends = ["cargo-binstall"],
}

"cargo:cargo-bloat" = {
    version = "latest",
    depends = ["cargo-binstall"],
}
