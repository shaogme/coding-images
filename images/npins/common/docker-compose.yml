services:
  # Base configuration for the application
  app-base: &app-base
    image: ghcr.io/shaogme/coding-images/npins-common:latest
    environment:
      - ROOT_PASSWORD=root # Set your secure password here
      - MISE_YES=1 # Non-interactive mode for mise
    security_opt:
      - seccomp:unconfined # Required for some low-level operations
    cap_add:
      - SYS_ADMIN
      - SYS_PTRACE
      - NET_ADMIN
    tty: true

  # Develop mode: Mounts local directory for hot-reloading (Default)
  dev:
    <<: *app-base
    container_name: npins-common-dev
    volumes:
      # Mount host source code
      - .:/root/workspace
      # Persist codex configuration
      - codex-config:/root/.codex
      - gemini-config:/root/.gemini
      - opencode-config:/root/.config/opencode
      - claude-config:/root/.claude

  # Standalone mode: Uses code copied into the image (No host mounting)
  standalone:
    <<: *app-base
    container_name: npins-common-standalone
    volumes:
      # Persist codex configuration
      - codex-config:/root/.codex
      - gemini-config:/root/.gemini
      - opencode-config:/root/.config/opencode
      - claude-config:/root/.claude
    profiles:
      - standalone

volumes:
  mise-cache:
  codex-config:
  gemini-config:
  opencode-config:
  claude-config:
