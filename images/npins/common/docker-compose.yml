x-podman-engine: &podman-engine
  image: ghcr.io/shaogme/nixos-dockers/podman:${NIXOS_DOCKERS_VERSION:-latest}
  command: ["podman", "system", "service", "--time=0", "unix:///run/podman/podman.sock"]
  environment:
    - PODMAN_SOCKET_GID=${PODMAN_SOCKET_GID:-1000}
    - PODMAN_SOCKET_MODE=${PODMAN_SOCKET_MODE:-0660}
  volumes:
    - podman-socket:/run/podman
    - podman-data:/var/lib/containers
    - .:/workspace
  cgroup: private
  cap_drop: [ALL]
  cap_add: [NET_ADMIN, SYS_ADMIN, SYS_CHROOT, SETUID, SETGID, SETPCAP, DAC_OVERRIDE, CHOWN, FOWNER, MKNOD]
  security_opt: ["seccomp:unconfined", "systempaths:unconfined", "label=disable"]
  group_add:
    - "${PODMAN_SOCKET_GID:-1000}"
  devices:
    - /dev/fuse:/dev/fuse
    - /dev/net/tun:/dev/net/tun
  healthcheck:
    test: ["CMD-SHELL", "podman --remote --url unix:///run/podman/podman.sock info >/dev/null 2>&1"]
    interval: 2s
    timeout: 3s
    retries: 30

x-app-base: &app-base
  image: ghcr.io/shaogme/coding-images/npins-common:latest
  cap_add: [NET_ADMIN, SYS_ADMIN]
  group_add:
    - "${PODMAN_SOCKET_GID:-1000}"
  security_opt: ["seccomp:unconfined", "apparmor:unconfined", "systempaths:unconfined", "label=disable"]
  environment:
    - DEVBOX_AUTO_INIT=${DEVBOX_AUTO_INIT:-0}
    - HOST_UID
    - HOST_GID
    - PODMAN_SOCKET_GID=${PODMAN_SOCKET_GID:-1000}
    - CONTAINER_HOST=unix:///run/podman/podman.sock
    - DOCKER_HOST=unix:///run/podman/podman.sock
  tty: true

services:
  podman:
    <<: *podman-engine
  dev:
    <<: *app-base
    container_name: npins-common-dev
    depends_on:
      podman:
        condition: service_healthy
    volumes:
      - .:/workspace
      - podman-socket:/run/podman
      - devbox-data:/data/devbox
      - cache:/data/cache
      - coding-config:/data/coding-config
    group_add:
      - "${PODMAN_SOCKET_GID:-1000}"

volumes:
  podman-socket:
  podman-data:
  devbox-data:
  coding-config:
  cache:
