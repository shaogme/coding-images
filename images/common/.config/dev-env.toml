schema = 1
id = "coding-images"
extends = ["nixos-docker"]

[config.environment.variables]
MISE_DATA_DIR = "/usr/local/share/mise"
MISE_CONFIG_DIR = "/etc/mise"
MISE_CACHE_DIR = "/data/cache/mise"
MISE_YES = "1"
XDG_DATA_HOME = "/data"
BINSTALL_NO_CONFIRM = "true"
BINSTALL_DISABLE_TELEMETRY = "true"
CARGO_NET_GIT_FETCH_WITH_CLI = "true"
DEVBOX_DATA_DIR = "/data/devbox"
CODING_CONFIG_DIR = "/data/coding-config"
CARGO_TARGET_DIR = "/data/.cargo/target"

[override."environment.path.prepend"]
op = "replace"
values = ["/usr/local/share/mise/shims", "/nix/var/nix/profiles/default/bin"]
reason = "put the coding-image tool shims ahead of the base runtime path"

[config.features.mise]
enabled = true
install_policy = "on-demand"

[config.features.devbox]
enabled = true
auto_init = "never"

[config.features.devbox-global]
enabled = true

[config.features.devbox-project]
enabled = true

[config.features.devbox-init]
enabled = true

[config.providers.mise]
executable = "/bin/mise"
prepare = [
  { argv = ["install"], failure = "error" },
]
shellenv = { argv = ["env", "-s", "{shell}"], format = "shell", failure = "error" }

[config.providers.devbox-global]
executable = "/usr/local/share/mise/shims/devbox"
shellenv = { argv = ["global", "shellenv"], format = "shell", failure = "ignore" }

[config.providers.devbox-project]
executable = "/usr/local/share/mise/shims/devbox"
detect_files = ["devbox.json"]
depends_on = ["mise"]
prepare = [
  { argv = ["install"], failure = "error" },
]
shellenv = { argv = ["shellenv"], format = "shell", failure = "error" }

[config.providers.devbox-init]
executable = "/usr/local/share/mise/shims/devbox"
depends_on = ["devbox-project"]
prepare = [
  { argv = ["init"], when = "!workspace.config-present && workspace.writable && features.devbox.auto_init == 'if-missing'", failure = "warn" },
]

[inputs."DEVBOX_AUTO_INIT"]
target = "features.devbox.auto_init"
type = "enum"
values = ["never", "if-missing", "ask"]
aliases = { "0" = "never", "false" = "never", "1" = "if-missing", "true" = "if-missing" }
runtime = true
export_as = "DEVBOX_AUTO_INIT"

[bootstrap]
schema = 1
mode = "strict"
workspace_root = "/workspace"
allow_workspace_overlay = false
non_interactive = "deny"

[[bootstrap.actions]]
id = "data-root"
kind = "filesystem.ensure_dir"
path = "/data"
mode = "1777"
owner = "root"
run_as = "root"

[[bootstrap.actions]]
id = "coding-config"
kind = "filesystem.ensure_dir"
path = "/data/coding-config"
mode = "1777"
owner = "root"
run_as = "root"
depends_on = ["data-root"]

[[bootstrap.actions]]
id = "claude-config"
kind = "filesystem.ensure_dir"
path = "/data/coding-config/claude"
mode = "1777"
owner = "root"
run_as = "root"
depends_on = ["coding-config"]

[[bootstrap.actions]]
id = "codex-config"
kind = "filesystem.ensure_dir"
path = "/data/coding-config/codex"
mode = "1777"
owner = "root"
run_as = "root"
depends_on = ["coding-config"]

[[bootstrap.actions]]
id = "gemini-config"
kind = "filesystem.ensure_dir"
path = "/data/coding-config/gemini"
mode = "1777"
owner = "root"
run_as = "root"
depends_on = ["coding-config"]

[[bootstrap.actions]]
id = "opencode-config"
kind = "filesystem.ensure_dir"
path = "/data/coding-config/opencode"
mode = "1777"
owner = "root"
run_as = "root"
depends_on = ["coding-config"]

[[bootstrap.actions]]
id = "cache"
kind = "filesystem.ensure_dir"
path = "/data/cache"
mode = "1777"
owner = "root"
run_as = "root"
depends_on = ["data-root"]

[[bootstrap.actions]]
id = "devbox-data"
kind = "filesystem.ensure_dir"
path = "/data/devbox"
mode = "1777"
owner = "root"
run_as = "root"
depends_on = ["data-root"]

[[bootstrap.actions]]
id = "cargo-data"
kind = "filesystem.ensure_dir"
path = "/data/cargo"
mode = "1777"
owner = "root"
run_as = "root"
depends_on = ["data-root"]

[[bootstrap.actions]]
id = "cargo-registry"
kind = "filesystem.ensure_dir"
path = "/data/cargo/registry"
mode = "1777"
owner = "root"
run_as = "root"
depends_on = ["cargo-data"]

[[bootstrap.actions]]
id = "cargo-git"
kind = "filesystem.ensure_dir"
path = "/data/cargo/git"
mode = "1777"
owner = "root"
run_as = "root"
depends_on = ["cargo-data"]

[[bootstrap.actions]]
id = "cargo-target"
kind = "filesystem.ensure_dir"
path = "/data/.cargo/target"
mode = "1777"
owner = "root"
run_as = "root"
depends_on = ["data-root"]

[[bootstrap.actions]]
id = "sccache-cache"
kind = "filesystem.ensure_dir"
path = "/data/cache/sccache"
mode = "1777"
owner = "root"
run_as = "root"
depends_on = ["cache"]

[[bootstrap.actions]]
id = "mise-cache"
kind = "filesystem.ensure_dir"
path = "/data/cache/mise"
mode = "1777"
owner = "root"
run_as = "root"
depends_on = ["cache"]

# HOME child directories are identity actions so root and dev receive separate
# ownership and permissions whenever container-init reconciles the identity.
[[bootstrap.actions]]
id = "home-config"
kind = "identity.ensure_home"
path = "${identity.home}/.config"
mode = "0700"
owner = "identity.target"
run_as = "root"

[[bootstrap.actions]]
id = "home-local"
kind = "identity.ensure_home"
path = "${identity.home}/.local"
mode = "0700"
owner = "identity.target"
run_as = "root"

[[bootstrap.actions]]
id = "home-cache"
kind = "identity.ensure_home"
path = "${identity.home}/.cache"
mode = "0700"
owner = "identity.target"
run_as = "root"

[[bootstrap.actions]]
id = "home-cargo"
kind = "identity.ensure_home"
path = "${identity.home}/.cargo"
mode = "0700"
owner = "identity.target"
run_as = "root"

[[bootstrap.actions]]
id = "cargo-registry-link-dev"
kind = "filesystem.ensure_symlink"
link = "/home/dev/.cargo/registry"
target = "/data/cargo/registry"
parent_mode = "0700"
owner = "root"
run_as = "root"
depends_on = ["home-cargo", "cargo-registry"]

[[bootstrap.actions]]
id = "cargo-registry-link-root"
kind = "filesystem.ensure_symlink"
link = "/root/.cargo/registry"
target = "/data/cargo/registry"
parent_mode = "0700"
owner = "root"
run_as = "root"
depends_on = ["home-cargo", "cargo-registry"]

[[bootstrap.actions]]
id = "cargo-git-link-dev"
kind = "filesystem.ensure_symlink"
link = "/home/dev/.cargo/git"
target = "/data/cargo/git"
parent_mode = "0700"
owner = "root"
run_as = "root"
depends_on = ["home-cargo", "cargo-git"]

[[bootstrap.actions]]
id = "cargo-git-link-root"
kind = "filesystem.ensure_symlink"
link = "/root/.cargo/git"
target = "/data/cargo/git"
parent_mode = "0700"
owner = "root"
run_as = "root"
depends_on = ["home-cargo", "cargo-git"]

# Keep the tool configuration shared while keeping the two HOME trees
# independent. Materialize both fixed HOME trees on every bootstrap so a
# later identity switch can use the same links without a second setup phase.
[[bootstrap.actions]]
id = "claude-link-dev"
kind = "filesystem.ensure_symlink"
link = "/home/dev/.claude"
target = "/data/coding-config/claude"
owner = "root"
run_as = "root"
depends_on = ["claude-config"]

[[bootstrap.actions]]
id = "claude-link-root"
kind = "filesystem.ensure_symlink"
link = "/root/.claude"
target = "/data/coding-config/claude"
owner = "root"
run_as = "root"
depends_on = ["claude-config"]

[[bootstrap.actions]]
id = "codex-link-dev"
kind = "filesystem.ensure_symlink"
link = "/home/dev/.codex"
target = "/data/coding-config/codex"
owner = "root"
run_as = "root"
depends_on = ["codex-config"]

[[bootstrap.actions]]
id = "codex-link-root"
kind = "filesystem.ensure_symlink"
link = "/root/.codex"
target = "/data/coding-config/codex"
owner = "root"
run_as = "root"
depends_on = ["codex-config"]

[[bootstrap.actions]]
id = "gemini-link-dev"
kind = "filesystem.ensure_symlink"
link = "/home/dev/.gemini"
target = "/data/coding-config/gemini"
owner = "root"
run_as = "root"
depends_on = ["gemini-config"]

[[bootstrap.actions]]
id = "gemini-link-root"
kind = "filesystem.ensure_symlink"
link = "/root/.gemini"
target = "/data/coding-config/gemini"
owner = "root"
run_as = "root"
depends_on = ["gemini-config"]

[[bootstrap.actions]]
id = "opencode-link-dev"
kind = "filesystem.ensure_symlink"
link = "/home/dev/.config/opencode"
target = "/data/coding-config/opencode"
parent_mode = "0700"
owner = "root"
run_as = "root"
depends_on = ["home-config", "opencode-config"]

[[bootstrap.actions]]
id = "opencode-link-root"
kind = "filesystem.ensure_symlink"
link = "/root/.config/opencode"
target = "/data/coding-config/opencode"
parent_mode = "0700"
owner = "root"
run_as = "root"
depends_on = ["home-config", "opencode-config"]
