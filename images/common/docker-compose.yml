services:
  # Base configuration for the application
  app-base: &app-base
    image: ghcr.io/shaogme/coding-images/common:latest
    environment:
      - ROOT_PASSWORD=root # Set your secure password here
      - MISE_YES=1 # Non-interactive mode for mise
      - HOST_UID=${HOST_UID:-1000:1000} # Adaptive UID/GID mapping to avoid file permission conflicts
      - CONTAINER_HOME=${CONTAINER_HOME:-/home/dev} # Default to /home/dev, override with /root for root user
    security_opt:
      - seccomp:unconfined # Required for some low-level operations
    cap_add:
      - SYS_ADMIN
      - SYS_PTRACE
      - NET_ADMIN
    tty: true

  # Develop mode: Mounts local directory for hot-reloading (Default)
  dev:
    <<: *app-base
    container_name: common-dev
    volumes:
      # Mount host source code
      - .:/workspace
      # Persist direnv data
      - direnv-data:${CONTAINER_HOME:-/home/dev}/.local/share/direnv
      # Persist codex configuration
      - codex-config:${CONTAINER_HOME:-/home/dev}/.codex
      - gemini-config:${CONTAINER_HOME:-/home/dev}/.gemini
      - opencode-config:${CONTAINER_HOME:-/home/dev}/.config/opencode
      - claude-config:${CONTAINER_HOME:-/home/dev}/.claude

volumes:
  mise-cache:
  direnv-data:
  codex-config:
  gemini-config:
  opencode-config:
  claude-config:
